{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">🔑 REDEFINIR SENHA</h4>
                </div>
                <div class="card-body">
                    <p>Verificação concluída com sucesso! Agora você pode redefinir sua senha.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label>Nova Senha:</label>
                            {{ form.nova_senha }}
                        </div>
                        <div class="mb-3">
                            <label>Confirmar Senha:</label>
                            {{ form.confirmar_senha }}
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">REDEFINIR SENHA</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
