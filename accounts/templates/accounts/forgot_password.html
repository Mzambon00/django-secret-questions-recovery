{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">🔐 RECUPERAR CONTA</h4>
                </div>
                <div class="card-body">
                    <h5 class="mb-3">Como deseja recuperar sua conta?</h5>
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <button class="btn btn-outline-primary w-100" onclick="showForm('email')">
                                📧 Email
                            </button>
                        </div>
                        <div class="col-md-6">
                            <button class="btn btn-outline-secondary w-100" onclick="showForm('perguntas')">
                                ❓ Perguntas Secretas
                            </button>
                        </div>
                    </div>
                    
                    <!-- Formulário Email -->
                    <div id="form-email" style="display: none;">
                        <form method="post">
                            {% csrf_token %}
                            <input type="hidden" name="metodo" value="email">
                            <div class="mb-3">
                                <label>Usuário/Email:</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">ENVIAR LINK</button>
                        </form>
                    </div>
                    
                    <!-- Formulário Perguntas -->
                    <div id="form-perguntas" style="display: none;">
                        <form method="post">
                            {% csrf_token %}
                            <input type="hidden" name="metodo" value="perguntas">
                            <div class="mb-3">
                                <label>Usuário/Email:</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-secondary w-100">VERIFICAR PERGUNTAS</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function showForm(tipo) {
    document.getElementById('form-email').style.display = 'none';
    document.getElementById('form-perguntas').style.display = 'none';
    
    if (tipo === 'email') {
        document.getElementById('form-email').style.display = 'block';
    } else {
        document.getElementById('form-perguntas').style.display = 'block';
    }
}
</script>
{% endblock %}
