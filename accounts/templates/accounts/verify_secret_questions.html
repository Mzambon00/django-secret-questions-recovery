{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">❓ VERIFICAÇÃO DE SEGURANÇA</h4>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <p>Etapa {{ etapa_atual }} de {{ total_etapas }}</p>
                        <div class="progress">
                            <div class="progress-bar" role="progressbar" style="width: {{ progresso }}%" 
                                 aria-valuenow="{{ progresso }}" aria-valuemin="0" aria-valuemax="100">
                                {{ progresso }}%
                            </div>
                        </div>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="alert alert-light border">
                            <h5 class="mb-3">Pergunta {{ etapa_atual }}:</h5>
                            <p class="lead">{{ pergunta.texto }}</p>
                        </div>
                        
                        <div class="mb-3">
                            <label>Resposta:</label>
                            {{ form.resposta }}
                        </div>
                        
                        <button type="submit" class="btn btn-primary">CONTINUAR</button>
                        <a href="{% url 'forgot_password' %}" class="btn btn-danger">CANCELAR</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
